<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Ratiprivatemuse Premium Overlay</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,
body{

width:100%;
height:100%;
overflow:hidden;
background:transparent;
font-family:
Segoe UI,
Arial,
sans-serif;

}

body{

position:relative;

}

.overlay{

position:absolute;

left:0;
top:0;

width:100%;
height:100%;

pointer-events:none;

}

/* ===========================
ROYAL BORDER
=========================== */

.frame{

position:absolute;

inset:10px;

border-radius:34px;

border:5px solid #cfa63b;

box-shadow:

0 0 10px #ffd54f,

0 0 25px rgba(255,215,0,.45),

inset 0 0 18px rgba(255,215,0,.25);

animation:

goldGlow 4s ease-in-out infinite;

}

@keyframes goldGlow{

0%{

box-shadow:

0 0 10px #ffd54f,

0 0 20px rgba(255,215,0,.35),

inset 0 0 12px rgba(255,215,0,.20);

}

50%{

box-shadow:

0 0 22px #ffe27a,

0 0 42px rgba(255,215,0,.70),

inset 0 0 30px rgba(255,215,0,.35);

}

100%{

box-shadow:

0 0 10px #ffd54f,

0 0 20px rgba(255,215,0,.35),

inset 0 0 12px rgba(255,215,0,.20);

}

}

/* ===========================
CORNERS
=========================== */

.corner{

position:absolute;

width:70px;

height:70px;

border:4px solid gold;

filter:drop-shadow(0 0 8px gold);

}

.tl{

top:10px;
left:10px;

border-right:none;
border-bottom:none;

border-radius:28px 0 0 0;

}

.tr{

top:10px;
right:10px;

border-left:none;
border-bottom:none;

border-radius:0 28px 0 0;

}

.bl{

bottom:10px;
left:10px;

border-right:none;
border-top:none;

border-radius:0 0 0 28px;

}

.br{

bottom:10px;
right:10px;

border-left:none;
border-top:none;

border-radius:0 0 28px 0;

}

/* ===========================
TOP TITLE
=========================== */

.header{

position:absolute;

top:18px;

left:50%;

transform:translateX(-50%);

text-align:center;

}

.header h1{

font-size:42px;

letter-spacing:4px;

font-weight:700;

color:#f5d76e;

text-shadow:

0 0 8px gold,

0 0 18px rgba(255,215,0,.6);

}

.header p{

margin-top:6px;

font-size:15px;

letter-spacing:4px;

color:#fff8d6;

opacity:.92;

}
  /* ===========================
BOTTOM ACTION BAR
=========================== */

.bottomBar{

position:absolute;

bottom:22px;

left:50%;

transform:translateX(-50%);

display:flex;

gap:18px;

padding:10px 18px;

border-radius:22px;

background:rgba(0,0,0,.28);

backdrop-filter:blur(10px);

box-shadow:
0 0 20px rgba(255,215,0,.20);

}

.action{

display:flex;

align-items:center;

justify-content:center;

min-width:145px;

height:52px;

padding:0 18px;

border-radius:16px;

border:2px solid rgba(255,215,0,.65);

background:linear-gradient(
180deg,
rgba(60,60,60,.35),
rgba(0,0,0,.55)
);

color:#f5d76e;

font-weight:700;

font-size:16px;

letter-spacing:.6px;

text-shadow:0 0 6px gold;

animation:buttonGlow 3s infinite;

}

.action:nth-child(2){

animation-delay:.5s;

}

.action:nth-child(3){

animation-delay:1s;

}

.action:nth-child(4){

animation-delay:1.5s;

}

@keyframes buttonGlow{

0%{

box-shadow:
0 0 8px rgba(255,215,0,.15);

}

50%{

box-shadow:
0 0 18px rgba(255,215,0,.45);

}

100%{

box-shadow:
0 0 8px rgba(255,215,0,.15);

}

}

/* ===========================
FLOATING SPARKLES
=========================== */

.spark{

position:absolute;

width:4px;

height:4px;

border-radius:50%;

background:#ffe38a;

box-shadow:
0 0 8px gold;

animation:floatSpark linear infinite;

opacity:.8;

}

.spark:nth-child(1){

top:18%;
left:10%;

animation-duration:8s;

}

.spark:nth-child(2){

top:75%;
left:18%;

animation-duration:10s;

}

.spark:nth-child(3){

top:28%;
right:12%;

animation-duration:9s;

}

.spark:nth-child(4){

bottom:18%;
right:20%;

animation-duration:7s;

}

.spark:nth-child(5){

top:50%;
left:8%;

animation-duration:12s;

}

.spark:nth-child(6){

top:42%;
right:8%;

animation-duration:11s;

}

@keyframes floatSpark{

0%{

transform:translateY(0px) scale(.6);

opacity:0;

}

20%{

opacity:1;

}

80%{

opacity:1;

}

100%{

transform:translateY(-45px) scale(1.3);

opacity:0;

}

}
  </style>

</head>

<body>

<div class="overlay">

    <!-- Premium Gold Border -->
    <div class="frame"></div>

    <!-- Luxury Corners -->
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <!-- Top Branding -->
    <div class="header">
        <h1>RATIPRIVATEMUSE</h1>
        <p>LUXURY • EXCLUSIVE • PREMIUM</p>
    </div>

    <!-- Floating Gold Sparkles -->
    <div class="spark"></div>
    <div class="spark"></div>
    <div class="spark"></div>
    <div class="spark"></div>
    <div class="spark"></div>
    <div class="spark"></div>

    <!-- Bottom Action Bar -->
    <div class="bottomBar">

        <div class="action">
            💌 DM
        </div>

        <div class="action">
            ⭐ SUBSCRIBE
        </div>

        <div class="action">
            ❤️ PERSONAL SHOW
        </div>

        <div class="action">
            📷 INSTAGRAM
        </div>

    </div>

</div>
  <!-- Responsive scaling for mobile -->
<style>
@media (max-width: 720px){

.header h1{
font-size:30px;
letter-spacing:2px;
}

.header p{
font-size:11px;
letter-spacing:2px;
}

.bottomBar{

width:94%;

left:50%;

transform:translateX(-50%);

gap:8px;

padding:8px;

}

.action{

min-width:auto;

flex:1;

height:46px;

font-size:12px;

padding:0 8px;

}

.corner{

width:50px;

height:50px;

}

.frame{

inset:6px;

}

}
</style>

</body>

</html>
