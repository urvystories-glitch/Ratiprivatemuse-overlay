<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Overlay Test</title>

<style>

html,
body{

margin:0;
padding:0;
width:100%;
height:100%;
background:transparent;
overflow:hidden;

}

#frame{

position:fixed;

top:10px;
left:10px;
right:10px;
bottom:10px;

border:8px solid gold;

border-radius:25px;

box-sizing:border-box;

}

#title{

position:fixed;

top:25px;

width:100%;

text-align:center;

font-size:34px;

font-family:Arial;

font-weight:bold;

color:gold;

}

#bottom{

position:fixed;

bottom:20px;

width:100%;

text-align:center;

font-size:22px;

font-family:Arial;

color:white;

}

</style>

</head>

<body>

<div id="frame"></div>

<div id="title">
RATIPRIVATEMUSE
</div>

<div id="bottom">
💌 DM &nbsp;&nbsp; ⭐ Subscribe &nbsp;&nbsp; ❤️ Personal Show &nbsp;&nbsp; 📷 Instagram
</div>

</body>

</html>
