<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Overlay</title><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;background:transparent;overflow:hidden;font-family:Arial,sans-serif}.frame{position:fixed;inset:8px;border:4px solid #d4af37;border-radius:28px;box-shadow:0 0 10px #d4af37,0 0 28px rgba(212,175,55,.45),inset 0 0 16px rgba(212,175,55,.25);animation:glow 3s infinite}@keyframes glow{50%{box-shadow:0 0 22px gold,0 0 44px rgba(255,215,0,.75),inset 0 0 26px rgba(255,215,0,.35)}}.top{position:fixed;top:14px;left:50%;transform:translateX(-50%);width:92%;padding:12px;border-radius:18px;background:rgba(0,0,0,.45);border:2px solid rgba(212,175,55,.6);backdrop-filter:blur(8px);text-align:center}.top h1{color:#f7d66b;font-size:32px;text-shadow:0 0 12px gold}.top p{color:#fff;font-size:12px;letter-spacing:3px}.live{position:fixed;top:24px;right:24px;background:#d40000;color:#fff;padding:7px 14px;border-radius:24px;font-weight:bold;animation:blink 1.4s infinite}@keyframes blink{50%{opacity:.45}}.corner{position:fixed;width:54px;height:54px;border:4px solid gold}.tl{top:8px;left:8px;border-right:none;border-bottom:none}.tr{top:8px;right:8px;border-left:none;border-bottom:none}.bl{bottom:8px;left:8px;border-right:none;border-top:none}.br{bottom:8px;right:8px;border-left:none;border-top:none}.bottom{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:10px;width:94%;justify-content:center;flex-wrap:wrap}.btn{background:rgba(0,0,0,.55);border:2px solid #d4af37;color:#f7d66b;padding:12px 18px;border-radius:14px;min-width:140px;text-align:center}</style></head><body><div class="frame"></div><div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div><div class="top"><h1>RATIPRIVATEMUSE</h1><p>LUXURY • EXCLUSIVE • PREMIUM</p></div><div class="live">🔴 LIVE</div><div class="bottom"><div class="btn">💌 DM</div><div class="btn">⭐ SUBSCRIBE</div><div class="btn">❤️ PERSONAL SHOW</div><div class="btn">📷 INSTAGRAM</div></div></body></html>
